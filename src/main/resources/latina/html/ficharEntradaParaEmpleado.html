<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fichar Entrada/Salida</title>
    <link rel="stylesheet" href="../css/ficharEntradaParaEmpleado.css">
    <link rel="stylesheet" href="../css/sideBar.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
<div id="sidebar-container"></div>

<main class="main-content">
    <div class="fichar-container">
        <div class="botones-fichar">
            <button class="fichar-btn entrada" onclick="ficharEntrada()">
                <i class="fas fa-sign-in-alt"></i> Fichar Entrada
            </button>
            <button class="fichar-btn salida" onclick="ficharSalida()">
                <i class="fas fa-sign-out-alt"></i> Fichar Salida
            </button>
        </div>
    </div>
</main>

<script src="../js/ficharEmpleado.js"></script>
<script src="../js/sideBarEmpleado.js"></script>
<!-- Popup Container -->
<div id="popup" class="popup-overlay">
    <div class="popup-box">
        <p id="popup-message">Has fichado correctamente</p>
        <button class="popup-button" onclick="cerrarMensaje()">OK</button>
    </div>
</div>
</body>
</html>
